name: Standalone Android Build

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: App version name
        required: true
        default: '1.0.0'
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-37' 'build-tools;37.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'

      - name: Install dependencies
        run: npm ci

      - name: Test API clients
        run: npm test -- --runInBand __tests__/api.test.ts __tests__/chatApi.test.ts

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!variable}" ]]; then
              echo "Missing signing secret: $variable"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.p12"

      - name: Build signed standalone APK and AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          bash android/gradlew -p android :app:assembleRelease :app:bundleRelease \
            "-PreleaseVersionCode=$((1000 + GITHUB_RUN_NUMBER))" \
            "-PreleaseVersionName=$RELEASE_VERSION_NAME" \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64 \
            --no-daemon --max-workers=2 --console=plain

      - name: Verify APK signature
        run: "$ANDROID_HOME/build-tools/37.0.0/apksigner verify --verbose android/app/build/outputs/apk/release/app-release.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: standalone-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: play-store-aab-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing key from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/android-release.p12"